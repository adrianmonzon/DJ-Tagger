name: Build DJ Tagger for macOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Calcular versión
        id: version
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Construyendo DJ Tagger $VERSION"

      - name: Crear configuración
        env:
          DEFAULT_SEARCH_URL: ${{ secrets.DJ_TAGGER_DEFAULT_SEARCH_URL }}
        run: |
          cat > .env <<EOF
          DJ_TAGGER_DEFAULT_SEARCH_URL=$DEFAULT_SEARCH_URL
          EOF

      - name: Actualizar versión de la aplicación
        run: |
          cat > version.py <<EOF
          APP_VERSION = "${{ steps.version.outputs.VERSION }}"
          EOF

      - name: Crear aplicación
        run: |
          pyinstaller \
            --name "DJ Tagger" \
            --windowed \
            --noconfirm \
            --clean \
            dj_tagger_gui.py

      - name: Crear ZIP para actualizaciones
        run: |
          cd dist
          zip -r "../DJ Tagger-macOS.zip" "DJ Tagger.app"
          cd ..

      - name: Crear DMG
        run: |
          mkdir -p dmg
          cp -R "dist/DJ Tagger.app" "dmg/"

          hdiutil create \
            -volname "DJ Tagger" \
            -srcfolder "dmg" \
            -ov \
            -format UDZO \
            "DJ Tagger.dmg"

      - name: Guardar archivos
        uses: actions/upload-artifact@v4
        with:
          name: DJ-Tagger-macOS
          path: |
            DJ Tagger.dmg
            DJ Tagger-macOS.zip

      - name: Crear release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: DJ Tagger v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            DJ Tagger.dmg
            DJ Tagger-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
