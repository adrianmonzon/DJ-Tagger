name: Build DJ Tagger for macOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
     contents: write	

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Crear configuración
        env:
          DEFAULT_SEARCH_URL: ${{ secrets.DJ_TAGGER_DEFAULT_SEARCH_URL }}
        run: |
          cat > .env <<EOF
          DJ_TAGGER_DEFAULT_SEARCH_URL=$DEFAULT_SEARCH_URL
          EOF

      - name: Crear aplicación
        run: |
          pyinstaller \
            --name "DJ Tagger" \
            --windowed \
            --noconfirm \
            --clean \
            dj_tagger_gui.py

      - name: Crear DMG
        run: |
          mkdir -p dmg
          cp -R "dist/DJ Tagger.app" "dmg/"
          hdiutil create \
            -volname "DJ Tagger" \
            -srcfolder "dmg" \
            -ov \
            -format UDZO \
            "DJ Tagger.dmg"

      - name: Guardar DMG
        uses: actions/upload-artifact@v4
        with:
          name: DJ-Tagger-macOS
          path: "DJ Tagger.dmg"

      - name: Crear release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: DJ Tagger v1.0.${{ github.run_number }}
          files: "DJ Tagger.dmg"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
