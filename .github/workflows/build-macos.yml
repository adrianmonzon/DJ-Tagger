name: Build DJ Tagger for macOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Calcular versión
        id: version
        run: |
          VERSION=$(python -c 'from version import APP_VERSION; print(APP_VERSION)')
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Construyendo DJ Tagger $VERSION"

      - name: Crear configuración
        env:
          DEFAULT_SEARCH_URL: ${{ secrets.DJ_TAGGER_DEFAULT_SEARCH_URL }}
        run: |
          cat > .env <<EOF2
          DJ_TAGGER_DEFAULT_SEARCH_URL=$DEFAULT_SEARCH_URL
          EOF2

      - name: Crear archivo de versión de macOS
        run: |
          cat > app_version.txt <<EOF2
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleShortVersionString</key>
              <string>${{ steps.version.outputs.VERSION }}</string>
              <key>CFBundleVersion</key>
              <string>${{ steps.version.outputs.VERSION }}</string>
          </dict>
          </plist>
          EOF2

      - name: Crear aplicación
        run: |
          ICON_FLAG=()
          if [ -f "icon.icns" ]; then
            ICON_FLAG=(--icon "icon.icns")
          fi

          pyinstaller \
            --name "DJ Tagger" \
            --windowed \
            --noconfirm \
            --clean \
            --osx-bundle-identifier "com.adrianmonzon.djtagger" \
            "${ICON_FLAG[@]}" \
            dj_tagger_gui.py

          PLIST="dist/DJ Tagger.app/Contents/Info.plist"

          /usr/libexec/PlistBuddy \
            -c "Delete :CFBundleShortVersionString" \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleShortVersionString string ${{ steps.version.outputs.VERSION }}" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Delete :CFBundleVersion" \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleVersion string ${{ steps.version.outputs.VERSION }}" \
            "$PLIST"

          echo "Versión:"
          plutil -p "$PLIST" | grep -E "CFBundle(Name|DisplayName|ShortVersionString|Version)"

          echo "Firmando aplicación..."
          codesign --force --deep --sign - "dist/DJ Tagger.app"

          echo "Comprobando firma..."
          codesign --verify --deep --strict --verbose=2 "dist/DJ Tagger.app"

      - name: Crear ZIP para actualizaciones
        run: |
          cd dist
          zip -r "../DJ Tagger-macOS.zip" "DJ Tagger.app"
          cd ..

      - name: Crear release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: DJ Tagger v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            DJ Tagger-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Crear DMG
        id: dmg
        continue-on-error: true
        run: |
          rm -rf dmg
          mkdir -p dmg
          cp -R "dist/DJ Tagger.app" "dmg/"
          rm -f "DJ Tagger.dmg"

          # hdiutil a veces falla con "Resource busy" en los runners de
          # GitHub por un recurso de disco que queda ocupado un instante.
          # Reintentamos varias veces antes de dar el paso por fallido.
          success=0

          for attempt in 1 2 3 4 5; do
            echo "Creando DMG (intento $attempt de 5)..."

            if hdiutil create \
              -volname "DJ Tagger" \
              -srcfolder "dmg" \
              -ov \
              -format UDZO \
              "DJ Tagger.dmg"; then
              success=1
              break
            fi

            echo "hdiutil falló, liberando recursos y reintentando..."

            hdiutil info | \
              awk '/image-path/{path=$0} /\/dev\/disk/{if (path ~ /DJ Tagger.dmg/) print $1}' | \
              xargs -I {} hdiutil detach {} -force >/dev/null 2>&1 || true

            sleep 5
          done

          if [ "$success" -ne 1 ]; then
            echo "ERROR: no se pudo crear el DMG tras varios intentos. Se omite (el ZIP ya está publicado)."
            exit 1
          fi

          echo "DMG creado correctamente."

      - name: Guardar archivos
        if: steps.dmg.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: DJ-Tagger-macOS
          path: |
            DJ Tagger.dmg
            DJ Tagger-macOS.zip

      - name: Adjuntar DMG al release
        if: steps.dmg.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          files: |
            DJ Tagger.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
